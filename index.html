<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Language Practice – Real-life situations</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--surf:#FFFFFF;--surf2:#F1F5F9;--line:#E2E8F0;--ink:#0F172A;--sec:#475569;--mut:#94A3B8;--pri:#2563EB;--prih:#1D4ED8;--pl:#DBEAFE;--prit:#1D4ED8;--sb:#EFF6FF;--sbt:#2563EB;--ok:#22C55E;--okbg:#DCFCE7;--okt:#15803D;--er:#EF4444;--erbg:#FEE2E2;--ert:#B91C1C;--wa:#F59E0B;--wabg:#FEF3C7;--wat:#92400E;--dis:#E2E8F0;--dist:#94A3B8;--h1:#EFF6FF;--h2:#DBEAFE;--sh:0 1px 2px rgba(15,23,42,.06);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F172A;--surf:#1E293B;--surf2:#334155;--line:#475569;--ink:#F8FAFC;--sec:#CBD5E1;--mut:#94A3B8;--pri:#3B82F6;--prih:#60A5FA;--pl:rgba(59,130,246,.18);--prit:#93C5FD;--sb:rgba(59,130,246,.16);--sbt:#93C5FD;--ok:#22C55E;--okbg:rgba(34,197,94,.16);--okt:#86EFAC;--er:#F87171;--erbg:rgba(248,113,113,.16);--ert:#FCA5A5;--wa:#FBBF24;--wabg:rgba(251,191,36,.16);--wat:#FCD34D;--dis:#334155;--dist:#94A3B8;--h1:#1E293B;--h2:#1E3A5F;--sh:none}}
:root[data-theme="dark"]{--bg:#0F172A;--surf:#1E293B;--surf2:#334155;--line:#475569;--ink:#F8FAFC;--sec:#CBD5E1;--mut:#94A3B8;--pri:#3B82F6;--prih:#60A5FA;--pl:rgba(59,130,246,.18);--prit:#93C5FD;--sb:rgba(59,130,246,.16);--sbt:#93C5FD;--ok:#22C55E;--okbg:rgba(34,197,94,.16);--okt:#86EFAC;--er:#F87171;--erbg:rgba(248,113,113,.16);--ert:#FCA5A5;--wa:#FBBF24;--wabg:rgba(251,191,36,.16);--wat:#FCD34D;--dis:#334155;--dist:#94A3B8;--h1:#1E293B;--h2:#1E3A5F;--sh:none}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Prompt,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:8px 0 4px;font-weight:600}
.sub{color:var(--sec);margin:0 0 20px}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.scenes{display:grid;gap:12px}
.scene{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px 16px;font:inherit;cursor:pointer}
.scene:hover,.cat:not(:disabled):hover{border-color:var(--pri)}
.scene b{display:block;font-weight:600}
.scene small{color:var(--sec)}
.scene .em{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--surf2);font-size:1.5rem}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.link{background:none;border:0;color:var(--sec);font:inherit;cursor:pointer;padding:6px 8px;border-radius:8px}
.link:hover{color:var(--prit);background:var(--pl)}
.prog{height:6px;background:var(--surf2);border-radius:3px;flex:1;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.chat{display:grid;gap:10px;margin-bottom:14px}
.b{max-width:88%;padding:10px 14px;border-radius:16px}
.staff{background:var(--surf);border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--sh)}
.me{background:var(--pri);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.me.bad{background:var(--erbg);color:var(--ert);border:1px solid var(--er)}
.th{display:block;color:var(--sec);font-size:.88rem;margin-top:2px}
.spk{background:none;border:0;cursor:pointer;font-size:1rem;padding:0 4px}
.fb{border-radius:12px;padding:10px 14px;font-size:.95rem;border:1px solid transparent}
.fb.ok{background:var(--okbg);color:var(--okt);border-color:var(--ok)}
.fb.try{background:var(--erbg);color:var(--ert);border-color:var(--er)}
.fb.warn{background:var(--wabg);color:var(--wat);border-color:var(--wa)}
.fb.sel{background:var(--pl);color:var(--prit);border-color:var(--pri)}
.fb .ans{color:var(--ink);display:block;margin-top:4px}
.modes{display:flex;gap:6px;background:var(--surf2);padding:4px;border-radius:999px;margin-bottom:10px}
.modes button{flex:1;border:0;border-radius:999px;padding:8px;font:inherit;background:none;color:var(--sec);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--surf);color:var(--prit);font-weight:600;box-shadow:var(--sh)}
.modes button:disabled{color:var(--dist);cursor:not-allowed}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--ink);font:inherit}
input[type=text]::placeholder{color:var(--mut)}
input[type=text]:focus{border-color:var(--pri)}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:500;background:var(--pri);color:#fff;cursor:pointer}
.btn:hover{background:var(--prih)}
.btn.alt{background:var(--sb);color:var(--sbt)}
.btn.alt:hover{background:var(--pl)}
.btn:disabled{background:var(--dis);color:var(--dist);cursor:not-allowed}
.mic{width:100%;padding:18px;font-size:1.05rem}
.mic.on,.mic.on:hover{background:var(--er);color:#fff}
.heard{color:var(--sec);min-height:1.5em;margin:8px 0}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.done{text-align:center;padding:24px 0}
.done .big{font-size:2.4rem}
.note{color:var(--sec);font-size:.88rem;margin-top:8px}
.vocab{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:10px 16px;margin-bottom:14px}
.vocab summary{cursor:pointer;font-weight:500}
.vocab .w{padding:3px 0}
.hero{background:var(--surf);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--pri);border-radius:16px;box-shadow:var(--sh);padding:22px 20px;margin-bottom:22px}
.hero .tag{letter-spacing:.14em;font-size:.75rem;color:var(--prit);font-weight:600}
.hero h1{margin:6px 0;color:var(--ink);font-size:1.5rem}
.hero p{margin:0 0 14px;color:var(--sec)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stats span{background:var(--surf2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem}
.sec{font-size:1.05rem;margin:0 0 10px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px;font:inherit;cursor:pointer}
.cat .em{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--cc,#2563EB) 14%,transparent);font-size:1.5rem}
.cat b{margin-top:4px}
.cat small{color:var(--sec)}
.cat .pill{align-self:flex-start;margin-top:6px;background:var(--surf2);color:var(--sec);border-radius:999px;padding:2px 10px;font-size:.78rem}
.cat .pill.go{background:var(--pl);color:var(--prit)}
.cat:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--pri);background:var(--pl)}
.langs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:6px}
.lang{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
.lang:hover{border-color:var(--pri)}
.lang[aria-pressed="true"]{background:var(--pl);border-color:var(--pri);color:var(--prit);font-weight:600}
.lang:disabled{background:var(--surf2);color:var(--dist);cursor:not-allowed;border-color:var(--line)}
.lang small{color:var(--mut)}
.grp{color:var(--sec);font-size:.85rem;margin:14px 0 8px}
.kind{display:inline-block;background:var(--pl);color:var(--prit);border-radius:999px;padding:2px 12px;font-size:.8rem;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer;margin:0 6px 6px 0}
.chip:hover{border-color:var(--pri)}
.built{min-height:56px;border:2px dashed var(--line);background:var(--surf2);border-radius:16px;padding:10px 10px 4px;margin-bottom:12px}
.built .chip{background:var(--pl);border-color:var(--pri);color:var(--prit)}
</style>
</head>

function start(k){st={scene:SCENES[k],i:0,mode:st.mode||"type",score:0,msgs:[],fb:null,done:false,heard:"",listening:false,hint:false,reveal:false,tries:0,missed:[],vo:false};

function push(){var t=st.turns[st.i];st.msgs.push({who:"s",t:t.s,th:t.th});st.opts=t.c?shuf(t.c):null;st.pool=t.kind==="order"?shuf(t.m.split(" ").map(function(w,i){return{w:w,i:i}})):null;st.built=[];st.fb=null;st.hint=false;st.reveal=false;st.tries=0;st.heard="";setTimeout(function(){say(t.s)},250)}
function fx(x){return norm(x).replace(/\s+/g," ").trim()}
var KINDS={free:"ตอบอิสระ",order:"เรียงประโยค",fill:"เติมคำ",listen:"ฟังแล้วเลือก",choice:"เลือกประโยค"};
function mk(t,sc){
  t=Object.assign({},t);
  if(t.c){t.kind="choice";return t}
  var m=t.a.split(" / ")[0],w=m.split(" "),r=Math.random(),cl=function(z){return z.replace(/[^\w'-]/g,"")};
  t.m=m;t.kind="free";
  if(r<.2&&w.length>=3)t.kind="order";
  else if(r>=.2&&r<.4){
    var best=w.reduce(function(x,y){return cl(y).length>cl(x).length?y:x},w[0]),cw=cl(best);
    if(cw.length>=4){
      var pool=[];
      SCENES.forEach(function(x){if(x.lang===lang)x.turns.forEach(function(u){u.a.split(" / ")[0].split(" ").forEach(function(z){z=cl(z);if(z.length>=4&&z.toLowerCase()!==cw.toLowerCase()&&pool.indexOf(z)<0)pool.push(z)})})});
      if(pool.length>=2){t.kind="fill";t.cw=cw;t.fill=m.replace(best,best.replace(cw,"_____"));t.c=[cw].concat(shuf(pool).slice(0,2))}
    }
  } else if(r>=.4&&r<.6){
    var o=sc.turns.filter(function(u){return u.a!==t.a&&!u.c}).map(function(u){return u.a.split(" / ")[0]});
    if(o.length>=2){t.kind="listen";t.c=[m].concat(shuf(o).slice(0,2))}
  }
  return t}
function norm(x){return x.toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?]/g," ")}
function check(text){
  var t=st.turns[st.i],n=norm(text);
  if(!n.trim())return;
  var ok=t.kind==="order"?fx(text)===fx(t.m):t.c?text===t.c[0]:t.kw.filter(function(k){return n.indexOf(k)>-1}).length>=t.need;
  if(ok){if(!st.tries)st.score++;st.fb={ok:true,a:t.a}}
  else{if(!st.tries)st.missed.push(t);st.tries++;st.fb={retry:true}}
  st.msgs.push({who:"m",t:text.trim(),bad:!ok});
  draw();
}
function next(){

}

function bind(){
  var $=function(i){return document.getElementById(i)};
  $("back").onclick=function(){if(rec){try{rec.abort()}catch(e){}}curCat?cat(curCat):home()};
  app.querySelectorAll("[data-say]").forEach(function(b){b.onclick=function(){say(b.dataset.say)}});
  if($("again"))$("again").onclick=function(){start(SCENES.indexOf(st.scene))};
  if($("other"))$("other").onclick=function(){curCat?cat(curCat):home()};
  if($("next"))$("next").onclick=next;
  if($("reveal"))$("reveal").onclick=function(){st.reveal=true;draw()};
  app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){check(b.dataset.t)}});
  app.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){st.built.push(+b.dataset.a);draw()}});
  app.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){st.built.splice(st.built.indexOf(+b.dataset.r),1);draw()}});
  if($("trt"))$("trt").onclick=function(){trl=trl==="off"?"th":"off";try{localStorage.setItem("te_tr",trl)}catch(e){}draw()};
  if($("clr"))$("clr").onclick=function(){st.built=[];draw()};
  if($("chk"))$("chk").onclick=function(){check(st.built.map(function(ix){return st.pool[ix].w}).join(" "))};
  if($("retry"))$("retry").onclick=function(){st.fb=null;st.built=[];draw()};
  if($("showans"))$("showans").onclick=function(){st.fb={ok:false,a:st.turns[st.i].a};draw()};
  var vd=app.querySelector("details.vocab");if(vd)vd.ontoggle=function(){st.vo=vd.open};
  if($("hint"))$("hint").onclick=function(){st.hint=true;draw()};
  if($("mt"))$("mt").onclick=function(){if(rec){try{rec.abort()}catch(e){}}st.mode="type";st.listening=false;draw()};
  if($("ms"))$("ms").onclick=function(){st.mode="speak";draw()};
  if($("send")){
    var go=function(){check($("inp").value)};
    $("send").onclick=go;
    $("inp").onkeydown=function(e){if(e.key==="Enter")go()};
    $("inp").focus({preventScroll:true});
  }
  if($("mic"))$("mic").onclick=listen;
}
function listen(){
  if(st.listening){try{rec.stop()}catch(e){}return}
  try{
    rec=new SR();rec.lang=LG().tts;rec.interimResults=false;rec.maxAlternatives=1;
    var got="";
    rec.onresult=function(e){got=e.results[0][0].transcript;st.heard=got};
    rec.onerror=function(e){st.listening=false;st.heard=e.error==="not-allowed"?"ไม่ได้รับอนุญาตใช้ไมค์ ลองใช้โหมดพิมพ์แทน":"ฟังไม่ชัด ลองอีกครั้ง";draw()};
    rec.onend=function(){st.listening=false;if(got)check(got);else draw()};
    rec.start();st.listening=true;st.heard="";draw();
  }catch(e){st.listening=false;st.mode="type";draw()}
}
home();
</script>
</body>
</html>
